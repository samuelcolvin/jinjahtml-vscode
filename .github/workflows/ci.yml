name: ci

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request: {}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci
      - run: npm run lint
      - run: npx --yes @vscode/vsce ls
      - run: npx --yes @vscode/vsce package

  deploy:
    needs: [lint]
    if: "success() && startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npx --yes @vscode/vsce publish --githubBranch main --no-git-tag-version
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
